<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTrack — Tableau de bord</title>
  <meta name="description" content="Suivi de temps par activités : timer, historique, export CSV.">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="app-title">TimeTrack</h1>
    </div>
    <ul class="nav-links">
      <li><a href="./" class="nav-link active" data-page="dashboard">
        <span class="nav-icon">⏱</span> Timer
      </a></li>
      <li><a href="history.html" class="nav-link" data-page="history">
        <span class="nav-icon">📋</span> Historique
      </a></li>
      <li><a href="settings.html" class="nav-link" data-page="settings">
        <span class="nav-icon">⚙️</span> Paramètres
      </a></li>
    </ul>
  </nav>

  <main class="content">
    <header class="page-header">
      <h2>Tableau de bord</h2>
      <p class="current-date" id="currentDate"></p>
    </header>

    <!-- Section Timer rapide -->
    <section class="card timer-quick">
      <h3>Démarrer une session</h3>
      <div class="form-group">
        <input type="text" id="quickActivityName" placeholder="Nom de l'activité" maxlength="100" autocomplete="off">
      </div>
      <div class="form-group">
        <div class="category-select-row">
          <select id="quickCategory">
            <option value="">Aucune catégorie</option>
          </select>
          <button type="button" class="btn btn-secondary btn-add-category" data-add-category="quickCategory" title="Ajouter une catégorie">+</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btnStartTimer">Démarrer le timer</button>
      <button class="btn btn-secondary btn-block" id="btnManualEntry">Saisie manuelle</button>
    </section>

    <!-- Timer en cours (caché par défaut) -->
    <section class="card timer-running" id="timerSection" style="display: none;">
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <p class="timer-activity" id="timerActivity"></p>
      <div class="timer-controls">
        <button class="btn btn-warning" id="btnPause">Pause</button>
        <button class="btn btn-danger" id="btnStop">Arrêter</button>
        <button class="btn btn-ghost" id="btnCancel">Annuler</button>
      </div>
    </section>

    <!-- Résumé du jour -->
    <section class="card day-summary">
      <h3>Résumé du jour</h3>
      <div class="summary-stats">
        <div class="stat">
          <span class="stat-value" id="totalTimeToday">0h 00</span>
          <span class="stat-label">Temps total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="sessionCountToday">0</span>
          <span class="stat-label">Sessions</span>
        </div>
      </div>
    </section>

    <!-- Formulaire manuel (caché par défaut) -->
    <section class="card manual-form" id="manualFormSection" style="display: none;">
      <h3>Nouvelle session</h3>
      <form id="sessionForm">
        <div class="form-group">
          <label for="activityName">Activité *</label>
          <input type="text" id="activityName" required maxlength="100" autocomplete="off" list="activitySuggestions">
          <datalist id="activitySuggestions"></datalist>
        </div>
        <div class="form-group">
          <label for="category">Catégorie</label>
          <div class="category-select-row">
            <select id="category">
              <option value="">Aucune</option>
            </select>
            <button type="button" class="btn btn-secondary btn-add-category" data-add-category="category" title="Ajouter une catégorie">+</button>
          </div>
        </div>
        <div class="form-group">
          <label for="sessionDate">Date *</label>
          <input type="date" id="sessionDate" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="startTime">Heure de début *</label>
            <input type="time" id="startTime" required>
          </div>
          <div class="form-group">
            <label for="endTime">Heure de fin *</label>
            <input type="time" id="endTime" required>
          </div>
        </div>
        <div class="form-group duration-display">
          <span>Durée : </span><strong id="calculatedDuration">0 min</strong>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="3" placeholder="Optionnel..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <button type="button" class="btn btn-ghost" id="btnCancelManual">Annuler</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Navigation mobile -->
  <nav class="mobile-nav" id="mobileNav">
    <a href="./" class="mobile-nav-link active" data-page="dashboard">
      <span class="mobile-nav-icon">⏱</span>
      <span>Timer</span>
    </a>
    <a href="history.html" class="mobile-nav-link" data-page="history">
      <span class="mobile-nav-icon">📋</span>
      <span>Historique</span>
    </a>
    <a href="settings.html" class="mobile-nav-link" data-page="settings">
      <span class="mobile-nav-icon">⚙️</span>
      <span>Paramètres</span>
    </a>
  </nav>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/db.js"></script>
  <script type="module" src="/js/session.js"></script>
  <script type="module" src="/js/timer.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
